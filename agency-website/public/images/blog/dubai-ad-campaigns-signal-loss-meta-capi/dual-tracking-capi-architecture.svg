<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0044BB" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0E1322" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="40" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Client-Side Tracking Degradation vs. Redundant Dual-Tracking Architecture</text>
  <text x="480" y="62" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">How Meta CAPI and Google Enhanced Conversions mitigate browser-level signal loss</text>

  <!-- User Action Box -->
  <g transform="translate(40, 150)">
    <rect width="170" height="180" rx="12" fill="url(#darkCard)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="85" y="32" text-anchor="middle" fill="#38BDF8" font-family="system-ui" font-size="13" font-weight="700">User Ad Interaction</text>
    
    <rect x="15" y="50" width="140" height="50" rx="6" fill="#1E293B"/>
    <text x="85" y="72" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Instagram / Google Ad</text>
    <text x="85" y="88" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">Mobile iOS / Android</text>

    <rect x="15" y="110" width="140" height="50" rx="6" fill="#1E293B"/>
    <text x="85" y="132" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Form Submission</text>
    <text x="85" y="148" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="9">Generate Unique event_id</text>
  </g>

  <!-- Branch 1: Browser Pixel (Top Lane - Vulnerable) -->
  <path d="M 210 200 L 260 140 L 310 140" stroke="#F87171" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="310,136 318,140 310,144" fill="#F87171"/>
  <text x="260" y="125" fill="#EF4444" font-family="system-ui" font-size="10" font-weight="600">Channel A: Browser Pixel</text>

  <g transform="translate(320, 95)">
    <rect width="250" height="100" rx="10" fill="#1F1318" stroke="#EF4444" stroke-width="1.5"/>
    <text x="125" y="28" text-anchor="middle" fill="#EF4444" font-family="system-ui" font-size="12" font-weight="600">Browser Script Execution (gtag / fbq)</text>
    <text x="125" y="50" text-anchor="middle" fill="#FCA5A5" font-family="system-ui" font-size="10">⚠️ Safari ITP 24h–7d Cookie Capping</text>
    <text x="125" y="68" text-anchor="middle" fill="#FCA5A5" font-family="system-ui" font-size="10">⚠️ Ad-blockers &amp; DNS Filters drop scripts</text>
    <text x="125" y="86" text-anchor="middle" fill="#FCA5A5" font-family="system-ui" font-size="10">⚠️ In-app webview context isolation</text>
  </g>

  <!-- Branch 2: Server-Side CAPI (Bottom Lane - Resilient) -->
  <path d="M 210 280 L 260 340 L 310 340" stroke="#10B981" stroke-width="2" fill="none"/>
  <polygon points="310,336 318,340 310,344" fill="#10B981"/>
  <text x="260" y="360" fill="#10B981" font-family="system-ui" font-size="10" font-weight="600">Channel B: Server CAPI</text>

  <g transform="translate(320, 290)">
    <rect width="250" height="105" rx="10" fill="#0C1F1C" stroke="#10B981" stroke-width="1.5"/>
    <text x="125" y="28" text-anchor="middle" fill="#10B981" font-family="system-ui" font-size="12" font-weight="600">Server-to-Server HTTPS Payload</text>
    <text x="125" y="50" text-anchor="middle" fill="#6EE7B7" font-family="system-ui" font-size="10">✓ SHA-256 Hashed Email &amp; Phone (+971)</text>
    <text x="125" y="68" text-anchor="middle" fill="#6EE7B7" font-family="system-ui" font-size="10">✓ Unhashed IP &amp; User-Agent Headers</text>
    <text x="125" y="86" text-anchor="middle" fill="#6EE7B7" font-family="system-ui" font-size="10">✓ Matching event_id + event_name</text>
  </g>

  <!-- Convergence to Deduplication Engine -->
  <path d="M 570 145 L 630 200 L 670 200" stroke="#F87171" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M 570 340 L 630 280 L 670 280" stroke="#10B981" stroke-width="2" fill="none"/>

  <!-- Ad Platform Receiver -->
  <g transform="translate(680, 130)">
    <rect width="240" height="230" rx="12" fill="url(#darkCard)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="120" y="32" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="13" font-weight="700">Meta &amp; Google Ad Engines</text>

    <rect x="15" y="52" width="210" height="75" rx="8" fill="#1E293B" stroke="#0066FF" stroke-width="1"/>
    <text x="120" y="74" text-anchor="middle" fill="#38BDF8" font-family="system-ui" font-size="11" font-weight="600">Event Deduplication Engine</text>
    <text x="120" y="92" text-anchor="middle" fill="#CBD5E1" font-family="system-ui" font-size="9">Evaluates matching event_name + event_id</text>
    <text x="120" y="108" text-anchor="middle" fill="#10B981" font-family="system-ui" font-size="9">Keeps richest payload; discards duplicate</text>

    <rect x="15" y="138" width="210" height="75" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="120" y="160" text-anchor="middle" fill="#10B981" font-family="system-ui" font-size="11" font-weight="600">Higher Match Quality (EMQ)</text>
    <text x="120" y="180" text-anchor="middle" fill="#CBD5E1" font-family="system-ui" font-size="9">Accurate attribution despite browser drops</text>
    <text x="120" y="196" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="9">Feeds downstream bidding models</text>
  </g>
</svg>