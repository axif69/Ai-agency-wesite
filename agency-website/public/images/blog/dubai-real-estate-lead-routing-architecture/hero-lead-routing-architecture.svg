<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0044BB" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0E1322" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="42" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">End-to-End Real Estate Lead-Routing Architecture</text>
  <text x="480" y="66" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Event-driven pipeline from portal webhook to CRM centralization and broker handover</text>

  <!-- Stage 1: Portals -->
  <g transform="translate(40, 110)">
    <rect width="150" height="310" rx="12" fill="url(#darkCard)" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="32" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1. Portal Ingestion</text>
    
    <rect x="15" y="55" width="120" height="60" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="75" y="82" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Property Finder</text>
    <text x="75" y="100" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">Webhooks / API</text>

    <rect x="15" y="130" width="120" height="60" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="75" y="157" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Bayut / Dubizzle</text>
    <text x="75" y="175" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">Partner Webhooks</text>

    <rect x="15" y="205" width="120" height="60" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="75" y="232" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Direct Inquiries</text>
    <text x="75" y="250" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">Campaign Forms</text>

    <text x="75" y="292" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">HTTPS POST (JSON)</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 190 265 L 235 265" stroke="#0066FF" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="235,261 243,265 235,269" fill="#0066FF"/>

  <!-- Stage 2: Ingestion & Normalization -->
  <g transform="translate(245, 110)">
    <rect width="190" height="310" rx="12" fill="url(#darkCard)" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="32" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2. Normalization &amp; Dedupe</text>
    
    <rect x="15" y="55" width="160" height="70" rx="8" fill="#1E293B" stroke="#0066FF" stroke-width="1"/>
    <text x="95" y="80" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">E.164 Phone Normalization</text>
    <text x="95" y="98" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="10">+971 5X XXX XXXX</text>
    <text x="95" y="114" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="9">Country code resolution</text>

    <rect x="15" y="140" width="160" height="70" rx="8" fill="#1E293B" stroke="#0066FF" stroke-width="1"/>
    <text x="95" y="165" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Idempotency &amp; Dedupe</text>
    <text x="95" y="183" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="10">Sliding Time Window</text>
    <text x="95" y="199" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="9">Collisions merged to 1 deal</text>

    <rect x="15" y="225" width="160" height="60" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="95" y="250" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DLQ Buffer (Dead-Letter)</text>
    <text x="95" y="270" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">Zero dropped inquiries</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 435 265 L 480 265" stroke="#0066FF" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="480,261 488,265 480,269" fill="#0066FF"/>

  <!-- Stage 3: CRM Core & Routing -->
  <g transform="translate(490, 110)">
    <rect width="200" height="310" rx="12" fill="url(#darkCard)" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="32" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">3. CRM &amp; Dynamic Assignment</text>
    
    <rect x="15" y="55" width="170" height="60" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="100" y="80" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Unified CRM Database</text>
    <text x="100" y="98" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">Deal + Contact Records</text>

    <rect x="15" y="130" width="170" height="155" rx="8" fill="#1E293B" stroke="#0066FF" stroke-width="1"/>
    <text x="100" y="152" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Routing Decision Matrix</text>
    
    <line x1="25" y1="164" x2="175" y2="164" stroke="#334155" stroke-width="1"/>
    
    <text x="30" y="184" fill="#CBD5E1" font-family="system-ui" font-size="10">• Community (Palm, Downtown)</text>
    <text x="30" y="204" fill="#CBD5E1" font-family="system-ui" font-size="10">• Language (AR / EN / RU / FR)</text>
    <text x="30" y="224" fill="#CBD5E1" font-family="system-ui" font-size="10">• Active Online Status</text>
    <text x="30" y="244" fill="#CBD5E1" font-family="system-ui" font-size="10">• Configurable Workload Cap</text>
    <text x="30" y="268" fill="#10B981" font-family="monospace" font-size="9">Failover on response timeout</text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 690 265 L 735 265" stroke="#0066FF" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="735,261 743,265 735,269" fill="#0066FF"/>

  <!-- Stage 4: Broker & Buyer Engagement -->
  <g transform="translate(745, 110)">
    <rect width="175" height="310" rx="12" fill="url(#darkCard)" stroke="#334155" stroke-width="1.5"/>
    <text x="87" y="32" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">4. Rapid Engagement</text>
    
    <rect x="15" y="55" width="145" height="110" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="87" y="78" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Official WhatsApp Cloud</text>
    <text x="87" y="98" text-anchor="middle" fill="#10B981" font-family="system-ui" font-size="10">• Instant Brochure PDF</text>
    <text x="87" y="118" text-anchor="middle" fill="#CBD5E1" font-family="system-ui" font-size="10">• Interactive Quick Replies</text>
    <text x="87" y="138" text-anchor="middle" fill="#CBD5E1" font-family="system-ui" font-size="10">• Budget &amp; Timeline triage</text>
    <text x="87" y="154" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="8">Official Meta API Path</text>

    <rect x="15" y="180" width="145" height="105" rx="8" fill="#1E293B" stroke="#0066FF" stroke-width="1"/>
    <text x="87" y="204" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Broker Handover</text>
    <text x="87" y="224" text-anchor="middle" fill="#CBD5E1" font-family="system-ui" font-size="10">• Context card delivered</text>
    <text x="87" y="244" text-anchor="middle" fill="#CBD5E1" font-family="system-ui" font-size="10">• Mobile CRM quick update</text>
    <text x="87" y="264" text-anchor="middle" fill="#38BDF8" font-family="system-ui" font-size="10">• High-touch consultation</text>
  </g>
</svg>