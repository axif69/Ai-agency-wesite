<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0044BB" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0E1322" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="38" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Traditional Fragile Intake vs. Event-Driven Engineered Pipeline</text>
  <text x="480" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Comparison of operational handoffs, data leakage, and response friction</text>

  <!-- Lane 1: Manual Fragile (Red/Amber) -->
  <g transform="translate(40, 90)">
    <rect width="880" height="150" rx="12" fill="#130D14" stroke="#7F1D1D" stroke-width="1.5"/>
    <text x="25" y="32" fill="#EF4444" font-family="system-ui" font-size="14" font-weight="700">TRADITIONAL MANUAL INTAKE (High Latency &amp; Data Drops)</text>

    <!-- Steps -->
    <g transform="translate(25, 55)">
      <rect width="140" height="70" rx="8" fill="#1C121A" stroke="#EF4444" stroke-width="1"/>
      <text x="70" y="30" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Portal Email</text>
      <text x="70" y="50" text-anchor="middle" fill="#F87171" font-family="system-ui" font-size="9">info@ mailbox clutter</text>

      <path d="M 145 35 L 175 35" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3"/>

      <rect x="180" width="140" height="70" rx="8" fill="#1C121A" stroke="#EF4444" stroke-width="1"/>
      <text x="250" y="30" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Manual Copy-Paste</text>
      <text x="250" y="50" text-anchor="middle" fill="#F87171" font-family="system-ui" font-size="9">Typing errors in phone</text>

      <path d="M 325 35 L 355 35" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3"/>

      <rect x="360" width="140" height="70" rx="8" fill="#1C121A" stroke="#EF4444" stroke-width="1"/>
      <text x="430" y="30" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Broadcast Group</text>
      <text x="430" y="50" text-anchor="middle" fill="#F87171" font-family="system-ui" font-size="9">First-to-grab chaos</text>

      <path d="M 505 35 L 535 35" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3"/>

      <rect x="540" width="140" height="70" rx="8" fill="#1C121A" stroke="#EF4444" stroke-width="1"/>
      <text x="610" y="30" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Delayed Call</text>
      <text x="610" y="50" text-anchor="middle" fill="#F87171" font-family="system-ui" font-size="9">Hours later / buyer cold</text>

      <path d="M 685 35 L 715 35" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3"/>

      <rect x="720" width="135" height="70" rx="8" fill="#1C121A" stroke="#EF4444" stroke-width="1"/>
      <text x="787" y="30" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Zero Audit Trail</text>
      <text x="787" y="50" text-anchor="middle" fill="#F87171" font-family="system-ui" font-size="9">Lost in private chat</text>
    </g>
  </g>

  <!-- Lane 2: Event-Driven Engineered (Green/Blue) -->
  <g transform="translate(40, 260)">
    <rect width="880" height="150" rx="12" fill="#0C1B24" stroke="#047857" stroke-width="1.5"/>
    <text x="25" y="32" fill="#10B981" font-family="system-ui" font-size="14" font-weight="700">ENGINEERED EVENT-DRIVEN PIPELINE (Automated &amp; Auditable)</text>

    <!-- Steps -->
    <g transform="translate(25, 55)">
      <rect width="140" height="70" rx="8" fill="#0D242C" stroke="#10B981" stroke-width="1"/>
      <text x="70" y="28" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">REST Webhook</text>
      <text x="70" y="46" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="9">Instant JSON payload</text>
      <text x="70" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="8">DLQ retry protection</text>

      <path d="M 145 35 L 175 35" stroke="#10B981" stroke-width="2"/>

      <rect x="180" width="140" height="70" rx="8" fill="#0D242C" stroke="#10B981" stroke-width="1"/>
      <text x="250" y="28" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">E.164 &amp; Dedupe</text>
      <text x="250" y="46" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="9">+971 formatting</text>
      <text x="250" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="8">Multi-inquiry collision merge</text>

      <path d="M 325 35 L 355 35" stroke="#10B981" stroke-width="2"/>

      <rect x="360" width="140" height="70" rx="8" fill="#0D242C" stroke="#10B981" stroke-width="1"/>
      <text x="430" y="28" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Matrix Assignment</text>
      <text x="430" y="46" text-anchor="middle" fill="#6EE7B7" font-family="system-ui" font-size="9">Territory + Language</text>
      <text x="430" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="8">Configurable load cap</text>

      <path d="M 505 35 L 535 35" stroke="#10B981" stroke-width="2"/>

      <rect x="540" width="140" height="70" rx="8" fill="#0D242C" stroke="#10B981" stroke-width="1"/>
      <text x="610" y="28" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Official WhatsApp</text>
      <text x="610" y="46" text-anchor="middle" fill="#6EE7B7" font-family="system-ui" font-size="9">Floorplan + Brochure</text>
      <text x="610" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="8">Interactive qualification</text>

      <path d="M 685 35 L 715 35" stroke="#10B981" stroke-width="2"/>

      <rect x="720" width="135" height="70" rx="8" fill="#0D242C" stroke="#10B981" stroke-width="1"/>
      <text x="787" y="28" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Broker Handover</text>
      <text x="787" y="46" text-anchor="middle" fill="#6EE7B7" font-family="system-ui" font-size="9">Structured context</text>
      <text x="787" y="60" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="8">Full CRM visibility</text>
    </g>
  </g>
</svg>