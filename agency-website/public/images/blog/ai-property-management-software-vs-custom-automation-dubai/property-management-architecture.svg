<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0E1322" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="960" height="520" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="42" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">Property Management Software vs. Automation Layer</text>
  <text x="480" y="64" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">The PMS remains the system of record; custom automation coordinates cross-system workflows</text>

  <!-- Risk Policy Banner -->
  <rect x="230" y="78" width="500" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="480" y="93" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Illustrative architecture — operational policies remain organization-specific</text>

  <!-- Left: Inbound Channels -->
  <g transform="translate(40, 125)">
    <rect width="180" height="350" rx="12" fill="url(#darkCard)" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1. Inbound Touchpoints</text>
    
    <rect x="15" y="55" width="150" height="70" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="90" y="78" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tenants &amp; Landlords</text>
    <text x="90" y="96" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">WhatsApp inquiries</text>
    <text x="90" y="110" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Voice notes &amp; text</text>

    <rect x="15" y="145" width="150" height="70" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="90" y="168" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Property Coordinators</text>
    <text x="90" y="186" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Web intake forms</text>
    <text x="90" y="200" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Move-in / move-out logs</text>

    <rect x="15" y="235" width="150" height="85" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="90" y="258" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">External Vendors</text>
    <text x="90" y="276" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Email quotes &amp; reports</text>
    <text x="90" y="290" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Job completion notes</text>
    <text x="90" y="306" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9">Channel Fragmentation</text>
  </g>

  <!-- Center: Automation Orchestration Layer -->
  <g transform="translate(260, 125)">
    <rect width="260" height="350" rx="12" fill="url(#blueCard)" stroke="#0066FF" stroke-width="2"/>
    <text x="130" y="32" text-anchor="middle" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. Custom Automation Layer</text>

    <rect x="15" y="55" width="230" height="60" rx="8" fill="#0B101D" stroke="#334155" stroke-width="1"/>
    <text x="130" y="78" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Event Ingestion &amp; Queues</text>
    <text x="130" y="96" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Webhooks, message queues, retries</text>

    <rect x="15" y="125" width="230" height="60" rx="8" fill="#0B101D" stroke="#334155" stroke-width="1"/>
    <text x="130" y="148" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Validation &amp; Idempotency</text>
    <text x="130" y="166" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Deduplication &amp; unit verification</text>

    <rect x="15" y="195" width="230" height="60" rx="8" fill="#0B101D" stroke="#334155" stroke-width="1"/>
    <text x="130" y="218" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Rules &amp; Routing Engine</text>
    <text x="130" y="236" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Custom approval chains &amp; alerts</text>

    <rect x="15" y="265" width="230" height="65" rx="8" fill="#0B101D" stroke="#10B981" stroke-width="1"/>
    <text x="130" y="288" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Audit &amp; Human Escalation</text>
    <text x="130" y="306" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Immutable event trail &amp; fallback</text>
  </g>

  <!-- Right Top: Core PMS (System of Record) -->
  <g transform="translate(560, 125)">
    <rect width="360" height="160" rx="12" fill="url(#darkCard)" stroke="#10B981" stroke-width="1.5"/>
    <text x="180" y="30" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">3. Core PMS (System of Record)</text>
    
    <g transform="translate(20, 48)">
      <rect width="150" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Lease Contracts</text>
      <text x="75" y="34" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Tenancy dates &amp; terms</text>
    </g>
    <g transform="translate(190, 48)">
      <rect width="150" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Unit Master Directory</text>
      <text x="75" y="34" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Building &amp; unit records</text>
    </g>
    <g transform="translate(20, 100)">
      <rect width="150" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Rent Schedules</text>
      <text x="75" y="34" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Payment installments</text>
    </g>
    <g transform="translate(190, 100)">
      <rect width="150" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Core Maintenance Log</text>
      <text x="75" y="34" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Master ticket history</text>
    </g>
  </g>

  <!-- Right Bottom: Accounting & Operations -->
  <g transform="translate(560, 310)">
    <rect width="360" height="165" rx="12" fill="url(#darkCard)" stroke="#334155" stroke-width="1.5"/>
    <text x="180" y="30" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">4. Supporting Systems &amp; Operations</text>
    
    <g transform="translate(20, 50)">
      <rect width="150" height="45" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Accounting / ERP</text>
      <text x="75" y="36" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">General ledger &amp; invoices</text>
    </g>
    <g transform="translate(190, 50)">
      <rect width="150" height="45" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="75" y="22" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CRM / Inquiries</text>
      <text x="75" y="36" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Prospects &amp; viewings</text>
    </g>

    <rect x="20" y="105" width="320" height="42" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
    <text x="160" y="124" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Human Operations &amp; Facilities Team</text>
    <text x="160" y="138" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Approval of quotes, tenant exceptions, on-site physical dispatch</text>
  </g>

  <!-- Connectors -->
  <path d="M 220 300 L 260 300" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M 520 205 L 560 205" stroke="#10B981" stroke-width="2"/>
  <path d="M 520 390 L 560 390" stroke="#F59E0B" stroke-width="2"/>
</svg>