<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="960" height="520" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="40" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">End-to-End Customs &amp; Commercial Document Automation Architecture</text>
  <text x="480" y="62" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Multi-channel ingestion, cognitive OCR, rule validation, human exception triage, and ERP/TMS synchronization</text>

  <!-- Banner -->
  <rect x="200" y="76" width="560" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="480" y="91" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Illustrative architecture — operational policies and downstream integrations remain organization-specific</text>

  <!-- Step 1: Multi-Channel Ingestion -->
  <g transform="translate(40, 115)">
    <rect width="180" height="155" rx="10" fill="url(#blueCard)" stroke="#0284C7" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Document Intake</text>
    <text x="15" y="55" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Email Inboxes (PDF/TIFF)</text>
    <text x="15" y="78" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• SFTP Partner Gateways</text>
    <text x="15" y="101" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Supplier / Freight Portals</text>
    <text x="15" y="124" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Cloud Shared Buckets</text>
    <text x="90" y="145" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9.5">SHA-256 Idempotency Key</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 220 192 L 255 192" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Ingestion & OCR Processing -->
  <g transform="translate(260, 115)">
    <rect width="200" height="155" rx="10" fill="url(#blueCard)" stroke="#0284C7" stroke-width="1.5"/>
    <text x="100" y="25" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. OCR &amp; Document Parsing</text>
    <text x="15" y="55" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• MIME &amp; Format Validation</text>
    <text x="15" y="78" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Multi-Page PDF Splitting</text>
    <text x="15" y="101" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Bilingual Arabic / English OCR</text>
    <text x="15" y="124" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Document Type Classifier</text>
    <text x="100" y="145" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9.5">Invoice / Packing List / BOL</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 460 192 L 495 192" stroke="#0284C7" stroke-width="2"/>

  <!-- Step 3: Extraction & Normalization -->
  <g transform="translate(500, 115)">
    <rect width="200" height="155" rx="10" fill="url(#blueCard)" stroke="#0284C7" stroke-width="1.5"/>
    <text x="100" y="25" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. Field Extraction Engine</text>
    <text x="15" y="55" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Header: Inv #, Date, Parties</text>
    <text x="15" y="78" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Line Items: SKU, Qty, Unit Prc</text>
    <text x="15" y="101" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Total Value, Currency, Origin</text>
    <text x="15" y="124" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Weights, Dimensions, Incoterms</text>
    <text x="100" y="145" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9.5">Canonical JSON Schema</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 700 192 L 735 192" stroke="#0284C7" stroke-width="2"/>

  <!-- Step 4: Validation & Confidence -->
  <g transform="translate(740, 115)">
    <rect width="180" height="155" rx="10" fill="url(#amberCard)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. Validation Layer</text>
    <text x="15" y="55" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Line Item Total Sum Check</text>
    <text x="15" y="78" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Currency Code Validation</text>
    <text x="15" y="101" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Duplicate Inv # Verification</text>
    <text x="15" y="124" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Cross-Check vs Packing List</text>
    <text x="90" y="145" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="9.5">Confidence Scoring Evaluator</text>
  </g>

  <!-- Down Branch: Pass vs Exception -->
  <path d="M 830 270 L 830 310 L 615 310" stroke="#F59E0B" stroke-width="2"/>
  <path d="M 615 310 L 615 330" stroke="#F59E0B" stroke-width="2"/>

  <!-- Step 5: Human Review Exception Queue -->
  <g transform="translate(480, 335)">
    <rect width="270" height="145" rx="10" fill="url(#amberCard)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="135" y="25" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">5. Human-in-the-Loop Review</text>
    <text x="15" y="52" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Low-Confidence Field Verification</text>
    <text x="15" y="73" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Ambiguous Descriptions / Illegibility</text>
    <text x="15" y="94" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Mandatory HS-Code Review Boundary</text>
    <text x="15" y="115" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Price / Quantity Discrepancy Gate</text>
    <text x="135" y="135" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10">Reviewer Authorization Committed</text>
  </g>

  <!-- Arrow 5 to 6 -->
  <path d="M 480 405 L 435 405" stroke="#10B981" stroke-width="2"/>

  <!-- Step 6: ERP & Downstream Sync -->
  <g transform="translate(190, 335)">
    <rect width="240" height="145" rx="10" fill="url(#greenCard)" stroke="#10B981" stroke-width="1.5"/>
    <text x="120" y="25" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">6. Downstream ERP / TMS Handoff</text>
    <text x="15" y="52" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• REST API / Webhook Dispatch</text>
    <text x="15" y="73" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• ERP Bill / Goods Receipt Draft</text>
    <text x="15" y="94" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• TMS Consignment Update</text>
    <text x="15" y="115" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Exponential Backoff + DLQ Buffer</text>
    <text x="120" y="135" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="9.5">State: Synchronized</text>
  </g>

  <!-- Arrow 6 to 7 -->
  <path d="M 190 405 L 145 405" stroke="#10B981" stroke-width="2"/>

  <!-- Step 7: Append-Only Audit Trail -->
  <g transform="translate(25, 335)">
    <rect width="120" height="145" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="60" y="25" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">7. Audit Log</text>
    <text x="10" y="55" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">• Raw PDF</text>
    <text x="10" y="75" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">• Extraction Log</text>
    <text x="10" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">• User Edits</text>
    <text x="10" y="115" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">• Time Stamped</text>
    <text x="60" y="135" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="9">Tamper-Evident</text>
  </g>
</svg>