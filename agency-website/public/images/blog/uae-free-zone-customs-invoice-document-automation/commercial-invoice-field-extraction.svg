<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <rect width="960" height="520" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="38" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Commercial Invoice Field Extraction &amp; Normalization Map</text>
  <text x="480" y="58" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Transforming unstructured multi-format supplier invoices into canonical data structures</text>

  <!-- Disclaimer Banner -->
  <rect x="230" y="72" width="500" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="480" y="86" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Illustrative extraction example — document formats vary by supplier and trade corridor</text>

  <!-- Left: Sample Raw Invoice Mockup -->
  <g transform="translate(40, 105)">
    <rect width="410" height="385" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect width="410" height="32" rx="8" fill="#1E293B"/>
    <text x="15" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RAW COMMERCIAL INVOICE (PDF / SCAN)</text>
    
    <!-- Invoice Details -->
    <text x="20" y="60" fill="#94A3B8" font-family="monospace" font-size="10.5">Supplier: GLOBAL INDUSTRIAL TOOLS CORP</text>
    <text x="20" y="78" fill="#94A3B8" font-family="monospace" font-size="10.5">Buyer: AL-MANSOOR LOGISTICS FZE (JAFZA)</text>
    <text x="20" y="96" fill="#94A3B8" font-family="monospace" font-size="10.5">Invoice No: GIT-2026-09842</text>
    <text x="20" y="114" fill="#94A3B8" font-family="monospace" font-size="10.5">Invoice Date: 09-09-2026</text>
    <text x="20" y="132" fill="#94A3B8" font-family="monospace" font-size="10.5">Currency: AED (Dirhams)</text>
    <text x="20" y="150" fill="#94A3B8" font-family="monospace" font-size="10.5">Incoterms: CIF Jebel Ali Port, Dubai</text>
    <text x="20" y="168" fill="#94A3B8" font-family="monospace" font-size="10.5">Country of Origin: Germany (DE)</text>

    <!-- Table Header in Mockup -->
    <line x1="20" y1="185" x2="390" y2="185" stroke="#334155" stroke-width="1"/>
    <text x="20" y="202" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="700">Line Item Description</text>
    <text x="240" y="202" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="700">Qty</text>
    <text x="290" y="202" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="700">Unit Price</text>
    <text x="350" y="202" fill="#E2E8F0" font-family="monospace" font-size="10" font-weight="700">Total</text>
    <line x1="20" y1="210" x2="390" y2="210" stroke="#334155" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="20" y="228" fill="#94A3B8" font-family="monospace" font-size="9.5">High-Pressure Hydraulic Valves</text>
    <text x="245" y="228" fill="#94A3B8" font-family="monospace" font-size="9.5">20</text>
    <text x="295" y="228" fill="#94A3B8" font-family="monospace" font-size="9.5">1,250.00</text>
    <text x="345" y="228" fill="#94A3B8" font-family="monospace" font-size="9.5">25,000.00</text>

    <!-- Row 2 -->
    <text x="20" y="250" fill="#94A3B8" font-family="monospace" font-size="9.5">Rotary Actuator Assemblies</text>
    <text x="245" y="250" fill="#94A3B8" font-family="monospace" font-size="9.5">15</text>
    <text x="295" y="250" fill="#94A3B8" font-family="monospace" font-size="9.5">3,400.00</text>
    <text x="345" y="250" fill="#94A3B8" font-family="monospace" font-size="9.5">51,000.00</text>

    <!-- Row 3 -->
    <text x="20" y="272" fill="#94A3B8" font-family="monospace" font-size="9.5">Industrial Seal Kits (NBR)</text>
    <text x="245" y="272" fill="#94A3B8" font-family="monospace" font-size="9.5">50</text>
    <text x="295" y="272" fill="#94A3B8" font-family="monospace" font-size="9.5">180.00</text>
    <text x="345" y="272" fill="#94A3B8" font-family="monospace" font-size="9.5">9,000.00</text>

    <!-- Totals -->
    <line x1="20" y1="285" x2="390" y2="285" stroke="#334155" stroke-width="1"/>
    <text x="200" y="308" fill="#E2E8F0" font-family="monospace" font-size="10.5" font-weight="700">SUBTOTAL (AED):</text>
    <text x="340" y="308" fill="#E2E8F0" font-family="monospace" font-size="10.5" font-weight="700">85,000.00</text>
    <text x="200" y="328" fill="#E2E8F0" font-family="monospace" font-size="10.5" font-weight="700">FREIGHT / INS:</text>
    <text x="345" y="328" fill="#E2E8F0" font-family="monospace" font-size="10.5" font-weight="700">4,200.00</text>
    <text x="200" y="348" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">INVOICE TOTAL:</text>
    <text x="340" y="348" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">89,200.00</text>

    <text x="20" y="372" fill="#64748B" font-family="monospace" font-size="9">Stamp: Verified &amp; Signed | Arabic/English Notes Attached</text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(460, 280)">
    <path d="M 0 0 L 35 0" stroke="#0066FF" stroke-width="3"/>
    <polygon points="35,-5 45,0 35,5" fill="#0066FF"/>
    <text x="20" y="-12" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">PARSED &amp; NORMALIZED</text>
  </g>

  <!-- Right: Canonical Normalized Schema -->
  <g transform="translate(510, 105)">
    <rect width="410" height="385" rx="8" fill="#0A101D" stroke="#0066FF" stroke-width="1.5"/>
    <rect width="410" height="32" rx="8" fill="#1E293B"/>
    <text x="15" y="21" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="700">STRUCTURED CANONICAL JSON OUTPUT</text>

    <text x="15" y="55" fill="#94A3B8" font-family="monospace" font-size="9.5">{</text>
    <text x="25" y="72" fill="#CBD5E1" font-family="monospace" font-size="9.5">"document_type": <tspan fill="#38BDF8">"commercial_invoice"</tspan>,</text>
    <text x="25" y="89" fill="#CBD5E1" font-family="monospace" font-size="9.5">"invoice_number": <tspan fill="#38BDF8">"GIT-2026-09842"</tspan>,</text>
    <text x="25" y="106" fill="#CBD5E1" font-family="monospace" font-size="9.5">"invoice_date_iso": <tspan fill="#38BDF8">"2026-09-09"</tspan>,</text>
    <text x="25" y="123" fill="#CBD5E1" font-family="monospace" font-size="9.5">"supplier_entity": <tspan fill="#38BDF8">"Global Industrial Tools Corp"</tspan>,</text>
    <text x="25" y="140" fill="#CBD5E1" font-family="monospace" font-size="9.5">"buyer_entity": <tspan fill="#38BDF8">"Al-Mansoor Logistics FZE"</tspan>,</text>
    <text x="25" y="157" fill="#CBD5E1" font-family="monospace" font-size="9.5">"free_zone_license": <tspan fill="#38BDF8">"JAFZA-FZ-88210"</tspan>,</text>
    <text x="25" y="174" fill="#CBD5E1" font-family="monospace" font-size="9.5">"currency_code": <tspan fill="#38BDF8">"AED"</tspan>,</text>
    <text x="25" y="191" fill="#CBD5E1" font-family="monospace" font-size="9.5">"incoterm_declared": <tspan fill="#38BDF8">"CIF_JEBEL_ALI"</tspan>,</text>
    <text x="25" y="208" fill="#CBD5E1" font-family="monospace" font-size="9.5">"country_of_origin": <tspan fill="#38BDF8">"DE"</tspan>,</text>
    <text x="25" y="225" fill="#CBD5E1" font-family="monospace" font-size="9.5">"totals": { "goods": <tspan fill="#34D399">85000.00</tspan>, "freight": <tspan fill="#34D399">4200.00</tspan>, "grand": <tspan fill="#34D399">89200.00</tspan> },</text>
    <text x="25" y="242" fill="#CBD5E1" font-family="monospace" font-size="9.5">"line_items_count": <tspan fill="#34D399">3</tspan>,</text>
    <text x="25" y="259" fill="#CBD5E1" font-family="monospace" font-size="9.5">"reconciliation": { "sum_match": <tspan fill="#34D399">true</tspan>, "variance_aed": <tspan fill="#34D399">0.00</tspan> },</text>
    <text x="25" y="276" fill="#CBD5E1" font-family="monospace" font-size="9.5">"extraction_confidence": { "header": <tspan fill="#34D399">0.96</tspan>, "items": <tspan fill="#34D399">0.94</tspan> },</text>
    <text x="25" y="293" fill="#CBD5E1" font-family="monospace" font-size="9.5">"hs_classification_state": <tspan fill="#FBBF24">"PENDING_HUMAN_VERIFICATION"</tspan>,</text>
    <text x="25" y="310" fill="#CBD5E1" font-family="monospace" font-size="9.5">"audit_trace_id": <tspan fill="#38BDF8">"AUD-20260909-GIT09842"</tspan></text>
    <text x="15" y="327" fill="#94A3B8" font-family="monospace" font-size="9.5">}</text>

    <!-- Visual status tag -->
    <rect x="25" y="342" width="360" height="28" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="205" y="360" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Ready for Validation Layer &amp; Human Review</text>
  </g>
</svg>