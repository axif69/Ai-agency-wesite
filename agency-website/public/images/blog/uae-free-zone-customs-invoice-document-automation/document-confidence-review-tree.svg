<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <rect width="960" height="520" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="38" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Document Confidence Evaluation &amp; Human-Review Decision Flow</text>
  <text x="480" y="58" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Multi-signal confidence scoring, deterministic reconciliation, and human verification routing</text>

  <!-- Required Label -->
  <rect x="230" y="74" width="500" height="22" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="480" y="89" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Thresholds are configurable and organization-specific</text>

  <!-- Top: Document Ingested & Parsed -->
  <g transform="translate(360, 110)">
    <rect width="240" height="65" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Document Ingested &amp; Parsed</text>
    <text x="120" y="48" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">OCR / Parser Extracts Field Array</text>
  </g>

  <!-- Arrow down to Validation -->
  <path d="M 480 175 L 480 205" stroke="#64748B" stroke-width="2"/>

  <!-- Middle: Rule-Based Validation -->
  <g transform="translate(330, 205)">
    <rect width="300" height="75" rx="10" fill="#1E293B" stroke="#0066FF" stroke-width="1.5"/>
    <text x="150" y="26" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Validation &amp; Confidence Gate</text>
    <text x="150" y="46" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">Sum Reconciliation • Currency Match • Date Valid</text>
    <text x="150" y="63" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">OCR Confidence Score (0.0 to 1.0)</text>
  </g>

  <!-- Three branches down -->
  <path d="M 360 280 L 160 330" stroke="#10B981" stroke-width="2"/>
  <path d="M 480 280 L 480 330" stroke="#F59E0B" stroke-width="2"/>
  <path d="M 600 280 L 800 330" stroke="#EF4444" stroke-width="2"/>

  <!-- Branch 1: High Confidence -->
  <g transform="translate(60, 330)">
    <rect width="230" height="150" rx="10" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1.5"/>
    <text x="115" y="25" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tier 1: High Confidence</text>
    <text x="115" y="44" text-anchor="middle" fill="#A7F3D0" font-family="monospace" font-size="10">Illustrative: Score ≥ 0.90</text>
    <text x="15" y="70" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• All line sums reconcile exactly</text>
    <text x="15" y="90" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Required fields verified</text>
    <text x="15" y="110" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Standard supplier template</text>
    <rect x="20" y="122" width="190" height="20" rx="4" fill="#065F46"/>
    <text x="115" y="136" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Ready for Structured Review</text>
  </g>

  <!-- Branch 2: Medium Confidence -->
  <g transform="translate(365, 330)">
    <rect width="230" height="150" rx="10" fill="#78350F" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="115" y="25" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tier 2: Medium / Ambiguous</text>
    <text x="115" y="44" text-anchor="middle" fill="#FDE68A" font-family="monospace" font-size="10">Illustrative: 0.70 &le; Score &lt; 0.90</text>
    <text x="15" y="70" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Partial scan skew / blur</text>
    <text x="15" y="90" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Unknown supplier layout</text>
    <text x="15" y="110" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Minor variance detected</text>
    <rect x="20" y="122" width="190" height="20" rx="4" fill="#92400E"/>
    <text x="115" y="136" text-anchor="middle" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Operator Confirmation Queue</text>
  </g>

  <!-- Branch 3: Low Confidence / Rejection -->
  <g transform="translate(670, 330)">
    <rect width="230" height="150" rx="10" fill="#7F1D1D" fill-opacity="0.3" stroke="#EF4444" stroke-width="1.5"/>
    <text x="115" y="25" text-anchor="middle" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tier 3: Low / Rejection</text>
    <text x="115" y="44" text-anchor="middle" fill="#FECACA" font-family="monospace" font-size="10">Illustrative: Score &lt; 0.70</text>
    <text x="15" y="70" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Illegible scan or stamp overlap</text>
    <text x="15" y="90" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Line sums do not reconcile</text>
    <text x="15" y="110" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Critical header fields missing</text>
    <rect x="20" y="122" width="190" height="20" rx="4" fill="#991B1B"/>
    <text x="115" y="136" text-anchor="middle" fill="#FECACA" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Manual Extraction Required</text>
  </g>
</svg>