<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0044BB" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0E1322" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="400" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="38" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Schema.org Entity Disambiguation Knowledge Graph</text>
  <text x="480" y="58" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Structured entity relationships assisting machine readability (illustrative template requiring verified data)</text>

  <!-- Central Node: RealEstateAgent -->
  <g transform="translate(380, 150)">
    <rect width="200" height="100" rx="16" fill="url(#blueGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#glow)"/>
    <text x="100" y="42" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="13" font-weight="700">RealEstateAgent</text>
    <text x="100" y="62" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="10">schema.org/RealEstateAgent</text>
    <text x="100" y="80" text-anchor="middle" fill="#CBD5E1" font-family="system-ui" font-size="9">Legal Agency Entity</text>
  </g>

  <!-- Node 1: Official Regulatory License (Top Left) -->
  <g transform="translate(80, 90)">
    <rect width="220" height="75" rx="10" fill="url(#darkCard)" stroke="#10B981" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" fill="#10B981" font-family="system-ui" font-size="11" font-weight="700">license</text>
    <text x="110" y="48" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10">YOUR_VERIFIED_DLD_LICENSE</text>
    <text x="110" y="64" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="8">Official DLD / RERA Registration</text>
  </g>
  <path d="M 300 135 L 380 180" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Node 2: Verified Physical Address (Bottom Left) -->
  <g transform="translate(80, 240)">
    <rect width="220" height="75" rx="10" fill="url(#darkCard)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" fill="#38BDF8" font-family="system-ui" font-size="11" font-weight="700">address (PostalAddress)</text>
    <text x="110" y="48" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="10">Physical Office, Business Bay</text>
    <text x="110" y="64" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="8">Dubai, United Arab Emirates</text>
  </g>
  <path d="M 300 270 L 380 220" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Node 3: Official sameAs Profiles (Top Right) -->
  <g transform="translate(660, 90)">
    <rect width="220" height="75" rx="10" fill="url(#darkCard)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="11" font-weight="700">sameAs</text>
    <text x="110" y="48" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="10">Official DLD / Registry Listings</text>
    <text x="110" y="64" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="8">Verified Corporate LinkedIn / Gov</text>
  </g>
  <path d="M 660 135 L 580 180" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Node 4: areaServed (Bottom Right) -->
  <g transform="translate(660, 240)">
    <rect width="220" height="75" rx="10" fill="url(#darkCard)" stroke="#A855F7" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" fill="#C084FC" font-family="system-ui" font-size="11" font-weight="700">areaServed (Place)</text>
    <text x="110" y="48" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-size="10">Dubai Hills, Palm Jumeirah</text>
    <text x="110" y="64" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="8">Specific sub-market coverage</text>
  </g>
  <path d="M 660 270 L 580 220" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>