<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0044BB" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0E1322" />
    </linearGradient>
  </defs>

  <rect width="960" height="420" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="38" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">AI Crawler Ecosystem: Search Indexing vs. Model Training</text>
  <text x="480" y="58" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Documented functions of search bots, training crawlers, and content controls (allowing crawlers does not guarantee citation)</text>

  <!-- Column 1: Google Ecosystem -->
  <g transform="translate(40, 90)">
    <rect width="270" height="290" rx="12" fill="url(#darkCard)" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="30" text-anchor="middle" fill="#38BDF8" font-family="system-ui" font-size="13" font-weight="700">Google Ecosystem</text>
    
    <rect x="15" y="50" width="240" height="100" rx="8" fill="#1E293B" stroke="#0066FF" stroke-width="1"/>
    <text x="25" y="72" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">Googlebot</text>
    <text x="25" y="90" fill="#10B981" font-family="system-ui" font-size="9" font-weight="600">Core Search &amp; AI Overviews</text>
    <text x="25" y="108" fill="#94A3B8" font-family="system-ui" font-size="8">Crawls and indexes web pages for Google</text>
    <text x="25" y="120" fill="#94A3B8" font-family="system-ui" font-size="8">Search results and AI Overview summaries.</text>
    <text x="25" y="136" fill="#64748B" font-family="system-ui" font-size="8">Governed by standard Search directives.</text>

    <rect x="15" y="165" width="240" height="105" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="25" y="187" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">Google-Extended</text>
    <text x="25" y="205" fill="#F59E0B" font-family="system-ui" font-size="9" font-weight="600">Gemini &amp; Vertex AI Training Control</text>
    <text x="25" y="223" fill="#94A3B8" font-family="system-ui" font-size="8">Standalone token governing AI content use.</text>
    <text x="25" y="235" fill="#94A3B8" font-family="system-ui" font-size="8">Does NOT impact Google Search indexation</text>
    <text x="25" y="247" fill="#94A3B8" font-family="system-ui" font-size="8">or AI Overviews eligibility.</text>
  </g>

  <!-- Column 2: OpenAI Ecosystem -->
  <g transform="translate(345, 90)">
    <rect width="270" height="290" rx="12" fill="url(#darkCard)" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="30" text-anchor="middle" fill="#10B981" font-family="system-ui" font-size="13" font-weight="700">OpenAI Ecosystem</text>
    
    <rect x="15" y="50" width="240" height="100" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="72" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">OAI-SearchBot</text>
    <text x="25" y="90" fill="#10B981" font-family="system-ui" font-size="9" font-weight="600">ChatGPT Search Web Indexer</text>
    <text x="25" y="108" fill="#94A3B8" font-family="system-ui" font-size="8">Used to index web content for ChatGPT Search</text>
    <text x="25" y="120" fill="#94A3B8" font-family="system-ui" font-size="8">results. Does NOT train foundation models.</text>
    <text x="25" y="136" fill="#64748B" font-family="system-ui" font-size="8">Allowing it enables search eligibility.</text>

    <rect x="15" y="165" width="240" height="105" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="25" y="187" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">GPTBot</text>
    <text x="25" y="205" fill="#94A3B8" font-family="system-ui" font-size="9" font-weight="600">Foundation Model Training Crawler</text>
    <text x="25" y="223" fill="#94A3B8" font-family="system-ui" font-size="8">Crawls public content to train OpenAI</text>
    <text x="25" y="235" fill="#94A3B8" font-family="system-ui" font-size="8">models. Can be disallowed in robots.txt</text>
    <text x="25" y="247" fill="#94A3B8" font-family="system-ui" font-size="8">without blocking ChatGPT Search.</text>
  </g>

  <!-- Column 3: Perplexity Ecosystem -->
  <g transform="translate(650, 90)">
    <rect width="270" height="290" rx="12" fill="url(#darkCard)" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="30" text-anchor="middle" fill="#A855F7" font-family="system-ui" font-size="13" font-weight="700">Perplexity Ecosystem</text>
    
    <rect x="15" y="50" width="240" height="100" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1"/>
    <text x="25" y="72" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">PerplexityBot</text>
    <text x="25" y="90" fill="#C084FC" font-family="system-ui" font-size="9" font-weight="600">Perplexity Search Crawler</text>
    <text x="25" y="108" fill="#94A3B8" font-family="system-ui" font-size="8">Crawler used by Perplexity for search/retrieval</text>
    <text x="25" y="120" fill="#94A3B8" font-family="system-ui" font-size="8">workflows, subject to its published docs.</text>
    <text x="25" y="136" fill="#64748B" font-family="system-ui" font-size="8">Parses content for citation generation.</text>

    <rect x="15" y="165" width="240" height="105" rx="8" fill="#0C1B24" stroke="#0066FF" stroke-width="1"/>
    <text x="25" y="187" fill="#38BDF8" font-family="system-ui" font-size="10" font-weight="700">Important Operational Principle:</text>
    <text x="25" y="207" fill="#CBD5E1" font-family="system-ui" font-size="8">• Robots.txt access allows technical crawling.</text>
    <text x="25" y="221" fill="#CBD5E1" font-family="system-ui" font-size="8">• It does NOT guarantee answer inclusion,</text>
    <text x="25" y="235" fill="#CBD5E1" font-family="system-ui" font-size="8">  favorable synthesis, or citation links.</text>
  </g>
</svg>