<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0E1322" />
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="42" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">Where Arabic Voice AI Encounters Complexity</text>
  <text x="480" y="66" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Comparing standard generic ASR systems vs. dialect-aware engineered pipelines</text>

  <!-- Card 1: Colloquial Vocabulary -->
  <g transform="translate(40, 100)">
    <rect width="425" height="155" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
    <text x="32" y="38" text-anchor="middle" fill="#EF4444" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">!</text>
    <text x="60" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">1. Colloquial Lexicon &amp; Phonetics</text>
    
    <text x="20" y="70" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Generic ASR Challenge:</text>
    <text x="20" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Trained primarily on Modern Standard Arabic (MSA). May struggle with</text>
    <text x="20" y="104" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Gulf colloquial terms like &quot;أبغي&quot;, &quot;زين&quot;, &quot;مب&quot;, &quot;وايد&quot;.</text>

    <text x="20" y="128" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Engineered Mitigation:</text>
    <text x="20" y="144" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">Acoustic models tuned with regional Gulf language resources.</text>
  </g>

  <!-- Card 2: Code Switching -->
  <g transform="translate(495, 100)">
    <rect width="425" height="155" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
    <text x="32" y="38" text-anchor="middle" fill="#EF4444" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">!</text>
    <text x="60" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">2. Arabic-English Code-Switching</text>

    <text x="20" y="70" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Generic ASR Challenge:</text>
    <text x="20" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Sentences like &quot;أبي 2-bedroom في Dubai Hills يكون ready&quot; can cause</text>
    <text x="20" y="104" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">decoding confusion across monolingual acoustic vocabularies.</text>

    <text x="20" y="128" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Engineered Mitigation:</text>
    <text x="20" y="144" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">Bilingual acoustic models configured to decode mixed-language utterances.</text>
  </g>

  <!-- Card 3: Ephemeral WhatsApp URLs -->
  <g transform="translate(40, 275)">
    <rect width="425" height="155" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
    <text x="32" y="38" text-anchor="middle" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">⏱</text>
    <text x="60" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">3. Short-Lived Ephemeral Media URLs</text>

    <text x="20" y="70" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Generic ASR Challenge:</text>
    <text x="20" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Temporary media URLs expire quickly; delayed message queues</text>
    <text x="20" y="104" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">encounter authorization errors if retrieval is deferred.</text>

    <text x="20" y="128" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Engineered Mitigation:</text>
    <text x="20" y="144" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">Prompt binary retrieval decoupled from downstream processing.</text>
  </g>

  <!-- Card 4: Real Estate Entity Ambiguity -->
  <g transform="translate(495, 275)">
    <rect width="425" height="155" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
    <text x="32" y="38" text-anchor="middle" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">#</text>
    <text x="60" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">4. Domain Entity Normalization</text>

    <text x="20" y="70" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Generic ASR Challenge:</text>
    <text x="20" y="88" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Unstructured phrasing (&quot;مليونين ونص&quot;, colloquial terms) requires</text>
    <text x="20" y="104" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">domain-aware parsing to avoid invalid CRM entries.</text>

    <text x="20" y="128" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Engineered Mitigation:</text>
    <text x="20" y="144" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10.5">Configurable schema extraction templates with property taxonomy.</text>
  </g>
</svg>