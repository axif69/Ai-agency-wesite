<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="treeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0E1322" />
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="2"/>
  <text x="480" y="42" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">Confidence Scoring &amp; Broker Takeover Framework</text>
  <text x="480" y="62" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Illustrative decision framework balancing automated intake against human broker review</text>\n  <rect x="230" y="72" width="500" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>\n  <text x="480" y="86" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Illustrative example — configure thresholds to your own operational risk policy</text>

  <!-- Input Node -->
  <g transform="translate(360, 95)">
    <rect width="240" height="60" rx="10" fill="url(#treeCard)" stroke="#0066FF" stroke-width="2"/>
    <text x="120" y="26" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Audio Payload Ingested</text>
    <text x="120" y="44" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10">Illustrative Multi-Signal Evaluation</text>
  </g>

  <!-- Branching Lines -->
  <path d="M 420 155 L 200 210" stroke="#10B981" stroke-width="2" fill="none"/>
  <path d="M 480 155 L 480 210" stroke="#F59E0B" stroke-width="2" fill="none"/>
  <path d="M 540 155 L 760 210" stroke="#EF4444" stroke-width="2" fill="none"/>

  <!-- Tier 1: High Confidence -->
  <g transform="translate(80, 210)">
    <rect width="240" height="225" rx="12" fill="url(#treeCard)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="12" y="12" width="216" height="30" rx="6" fill="#10B981" fill-opacity="0.15"/>
    <text x="120" y="32" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Tier 1: Illustrative Score ≥ 0.85</text>
    
    <text x="20" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Configurable Criteria:</text>
    <text x="20" y="82" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• High acoustic signal quality</text>
    <text x="20" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Strong token log-probabilities</text>
    <text x="20" y="114" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Key parameters identified</text>

    <text x="20" y="140" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Workflow Pattern:</text>
    <text x="20" y="157" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Automated CRM lead creation</text>
    <text x="20" y="173" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Standard acknowledgment dispatch</text>
    <text x="20" y="189" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Configurable broker notification</text>
    <text x="20" y="205" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Direct follow-up preparation</text>
  </g>

  <!-- Tier 2: Partial Confidence -->
  <g transform="translate(360, 210)">
    <rect width="240" height="225" rx="12" fill="url(#treeCard)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="12" y="12" width="216" height="30" rx="6" fill="#F59E0B" fill-opacity="0.15"/>
    <text x="120" y="32" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Tier 2: Illustrative 0.65 – 0.84</text>

    <text x="20" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Configurable Criteria:</text>
    <text x="20" y="82" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Moderate acoustic noise</text>
    <text x="20" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Core intent clear; field partial</text>
    <text x="20" y="114" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• e.g. community ambiguity</text>

    <text x="20" y="140" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Workflow Pattern:</text>
    <text x="20" y="157" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Single clarification query</text>
    <text x="20" y="173" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Pending review record created</text>
    <text x="20" y="189" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Broker alerted with draft context</text>
    <text x="20" y="205" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Guardrails prevent repeat loops</text>
  </g>

  <!-- Tier 3: Low Confidence / Complex -->
  <g transform="translate(640, 210)">
    <rect width="240" height="225" rx="12" fill="url(#treeCard)" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="12" y="12" width="216" height="30" rx="6" fill="#EF4444" fill-opacity="0.15"/>
    <text x="120" y="32" text-anchor="middle" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Tier 3: Illustrative Score &lt; 0.65</text>

    <text x="20" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Configurable Criteria:</text>
    <text x="20" y="82" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Low signal-to-noise ratio</text>
    <text x="20" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Complex multi-unit enquiry</text>
    <text x="20" y="114" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">• Highly dialectal phrasing</text>

    <text x="20" y="140" fill="#F87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Workflow Pattern:</text>
    <text x="20" y="157" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Automated bot reply withheld</text>
    <text x="20" y="173" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Immediate human broker alert</text>
    <text x="20" y="189" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Raw audio + transcript available</text>
    <text x="20" y="205" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">• Protects client relationship</text>
  </g>
</svg>